<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Appointment Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .stats {
            display: flex;
            gap: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 2em;
            font-weight: bold;
        }

        .stat-card .label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .search-box {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1em;
            transition: border 0.3s;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .filter-btn:not(.active) {
            background: #f0f0f0;
            color: #666;
        }

        .filter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .bookings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }

        .booking-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .booking-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .booking-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .patient-info h3 {
            font-size: 1.4em;
            color: #333;
            margin-bottom: 5px;
        }

        .patient-gender {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .gender-male {
            background: #e3f2fd;
            color: #1976d2;
        }

        .gender-female {
            background: #fce4ec;
            color: #c2185b;
        }

        .booking-details {
            margin: 15px 0;
        }

        .detail-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            color: #666;
        }

        .detail-row svg {
            width: 20px;
            height: 20px;
            color: #667eea;
        }

        .problems {
            background: #f5f5f5;
            padding: 10px 15px;
            border-radius: 10px;
            margin: 10px 0;
        }

        .problems strong {
            color: #667eea;
        }

        .delete-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            width: 100%;
            margin-top: 15px;
        }

        .delete-btn:hover {
            background: #ff3838;
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            color: #ddd;
            margin-bottom: 20px;
        }

        .empty-state h2 {
            color: #666;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #999;
        }

        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .refresh-btn:hover {
            transform: scale(1.1) rotate(180deg);
        }

        .refresh-btn svg {
            width: 30px;
            height: 30px;
            color: white;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .booking-card {
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 11a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"></path>
                    <path d="M17.657 16.657l-4.243 4.243a2 2 0 0 1 -2.827 0l-4.244 -4.243a8 8 0 1 1 11.314 0z"></path>
                </svg>
                Appointment Queue
            </h1>
            <div class="stats">
                <div class="stat-card">
                    <div class="number" id="totalCount">0</div>
                    <div class="label">Total Bookings</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="todayCount">0</div>
                    <div class="label">Today</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search by name, mobile, or problem...">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="today">Today</button>
            <button class="filter-btn" data-filter="upcoming">Upcoming</button>
            <button class="filter-btn" data-filter="past">Past</button>
        </div>

        <div class="bookings-grid" id="bookingsGrid"></div>
    </div>

    <button class="refresh-btn" onclick="loadBookings()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
        </svg>
    </button>

    <script>
        let allBookings = [];
        let currentFilter = 'all';

        async function loadBookings() {
            try {
                const response = await fetch('/api/bookings');
                const data = await response.json();
                allBookings = data.bookings;
                updateStats();
                renderBookings();
            } catch (error) {
                console.error('Error loading bookings:', error);
            }
        }

        function updateStats() {
            const today = new Date().toISOString().split('T')[0];
            const todayBookings = allBookings.filter(b => b.appointment_date === today);
            
            document.getElementById('totalCount').textContent = allBookings.length;
            document.getElementById('todayCount').textContent = todayBookings.length;
        }

        function filterBookings() {
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            const today = new Date().toISOString().split('T')[0];
            
            let filtered = allBookings;

            // Apply date filter
            if (currentFilter === 'today') {
                filtered = filtered.filter(b => b.appointment_date === today);
            } else if (currentFilter === 'upcoming') {
                filtered = filtered.filter(b => b.appointment_date >= today);
            } else if (currentFilter === 'past') {
                filtered = filtered.filter(b => b.appointment_date < today);
            }

            // Apply search filter
            if (searchTerm) {
                filtered = filtered.filter(b => 
                    b.name.toLowerCase().includes(searchTerm) ||
                    b.surname.toLowerCase().includes(searchTerm) ||
                    b.mobile_no.includes(searchTerm) ||
                    b.problems.toLowerCase().includes(searchTerm)
                );
            }

            return filtered;
        }

        function renderBookings() {
            const grid = document.getElementById('bookingsGrid');
            const filtered = filterBookings();
            
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        <h2>No Appointments Found</h2>
                        <p>There are no bookings matching your criteria.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(booking => `
                <div class="booking-card">
                    <div class="booking-header">
                        <div class="patient-info">
                            <h3>${booking.name} ${booking.surname}</h3>
                            <span class="patient-gender gender-${booking.gender}">${booking.gender.toUpperCase()}</span>
                        </div>
                    </div>
                    
                    <div class="booking-details">
                        <div class="detail-row">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="16" y1="2" x2="16" y2="6"></line>
                                <line x1="8" y1="2" x2="8" y2="6"></line>
                                <line x1="3" y1="10" x2="21" y2="10"></line>
                            </svg>
                            <strong>${booking.appointment_date}</strong> at ${booking.favorable_time}
                        </div>
                        
                        <div class="detail-row">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                            </svg>
                            <span>${booking.mobile_no}</span>
                        </div>
                    </div>
                    
                    <div class="problems">
                        <strong>Problems:</strong> ${booking.problems}
                    </div>
                    
                    <button class="delete-btn" onclick="deleteBooking(${booking.id})">
                        🗑️ Remove from Queue
                    </button>
                </div>
            `).join('');
        }

        async function deleteBooking(id) {
            if (!confirm('Are you sure you want to remove this booking?')) return;
            
            try {
                const response = await fetch(`/api/bookings/${id}`, { method: 'DELETE' });
                const data = await response.json();
                
                if (data.status === 'success') {
                    loadBookings();
                }
            } catch (error) {
                console.error('Error deleting booking:', error);
                alert('Failed to delete booking');
            }
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', renderBookings);

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderBookings();
            });
        });

        // Auto-refresh every 30 seconds
        setInterval(loadBookings, 30000);

        // Initial load
        loadBookings();
    </script>
</body>
</html>
